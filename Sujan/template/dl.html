<!DOCTYPE html>
<html lang="en">
<head>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-glass: rgba(18, 18, 26, 0.8);
      --accent-primary: #6366f1;
      --accent-secondary: #8b5cf6;
      --accent-tertiary: #ec4899;
      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #ec4899 100%);
      --accent-glow: rgba(99, 102, 241, 0.4);
      --text-primary: #ffffff;
      --text-secondary: #a1a1aa;
      --text-muted: #71717a;
      --success: #10b981;
      --border: rgba(255, 255, 255, 0.08);
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.5);
      --shadow-glow: 0 0 40px rgba(99, 102, 241, 0.3);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
    }

    /* Animated Background */
    .bg-animation {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .bg-gradient {
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.15;
      animation: float 20s ease-in-out infinite;
    }

    .bg-gradient-1 {
      background: var(--accent-primary);
      top: -200px;
      right: -200px;
      animation-delay: 0s;
    }

    .bg-gradient-2 {
      background: var(--accent-secondary);
      bottom: -200px;
      left: -200px;
      animation-delay: -10s;
    }

    .bg-gradient-3 {
      background: var(--accent-tertiary);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 400px;
      height: 400px;
      opacity: 0.08;
      animation-delay: -5s;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(30px, -30px) scale(1.1); }
      50% { transform: translate(-20px, 20px) scale(0.95); }
      75% { transform: translate(-30px, -20px) scale(1.05); }
    }

    /* Grid Pattern Overlay */
    .grid-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 50px 50px;
      z-index: 1;
      pointer-events: none;
    }

    /* Header */
    header {
      position: relative;
      z-index: 100;
      padding: 20px 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(to bottom, rgba(10, 10, 15, 0.9), transparent);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 22px;
      font-weight: 700;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      background: var(--accent-gradient);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-text-fill-color: white;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
    }

    .theme-toggle {
      width: 48px;
      height: 48px;
      border: 1px solid var(--border);
      background: var(--bg-glass);
      backdrop-filter: blur(10px);
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: var(--text-secondary);
      transition: all 0.3s ease;
    }

    .theme-toggle:hover {
      border-color: var(--accent-primary);
      color: var(--accent-primary);
      transform: rotate(180deg);
      box-shadow: 0 0 20px var(--accent-glow);
    }

    /* Main Container */
    .main-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 5%;
      position: relative;
      z-index: 10;
      min-height: calc(100vh - 200px);
    }

    /* Glass Card */
    .glass-card {
      background: var(--bg-glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 48px;
      max-width: 600px;
      width: 100%;
      text-align: center;
      box-shadow: var(--shadow-lg), 0 0 60px rgba(99, 102, 241, 0.1);
      position: relative;
      overflow: hidden;
    }

    .glass-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
    }

    .card-glow {
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 0.5s ease;
      pointer-events: none;
    }

    .glass-card:hover .card-glow {
      opacity: 0.5;
    }

    /* File Icon */
    .file-icon-wrapper {
      position: relative;
      display: inline-block;
      margin-bottom: 32px;
    }

    .file-icon {
      width: 100px;
      height: 100px;
      background: var(--accent-gradient);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      color: white;
      box-shadow: 0 8px 32px rgba(99, 102, 241, 0.4);
      position: relative;
      z-index: 2;
      animation: pulse-glow 3s ease-in-out infinite;
    }

    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 8px 32px rgba(99, 102, 241, 0.4); }
      50% { box-shadow: 0 8px 48px rgba(99, 102, 241, 0.6), 0 0 60px rgba(99, 102, 241, 0.3); }
    }

    .file-icon-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 120px;
      height: 120px;
      border: 2px solid rgba(99, 102, 241, 0.3);
      border-radius: 50%;
      animation: ring-expand 2s ease-out infinite;
    }

    .file-icon-ring:nth-child(2) {
      animation-delay: 0.5s;
    }

    @keyframes ring-expand {
      0% { transform: translate(-50%, -50%) scale(0.8); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1.3); opacity: 0; }
    }

    /* Filename */
    .filename-container {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 12px;
      padding: 16px 24px;
      margin-bottom: 32px;
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .filename {
      font-size: 18px;
      font-weight: 500;
      color: var(--text-primary);
      white-space: nowrap;
      animation: scroll-text 15s linear infinite;
      display: inline-block;
    }

    @keyframes scroll-text {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }

    /* Download Button */
    .download-btn-wrapper {
      position: relative;
      display: inline-block;
    }

    .download-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 18px 48px;
      background: var(--accent-gradient);
      border: none;
      border-radius: 16px;
      color: white;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 18px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      overflow: hidden;
      transition: all 0.3s ease;
      box-shadow: 0 8px 32px rgba(99, 102, 241, 0.4);
    }

    .download-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      transition: left 0.5s ease;
    }

    .download-btn:hover::before {
      left: 100%;
    }

    .download-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 40px rgba(99, 102, 241, 0.5), var(--shadow-glow);
    }

    .download-btn:active {
      transform: translateY(-1px);
    }

    .download-btn i {
      font-size: 20px;
      animation: bounce 1s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    /* File Size Badge */
    .file-size {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 24px;
      padding: 10px 20px;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 50px;
      font-size: 14px;
      font-weight: 600;
      color: var(--accent-primary);
    }

    /* Features */
    .features {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-top: 32px;
      flex-wrap: wrap;
    }

    .feature {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .feature i {
      color: var(--success);
      font-size: 14px;
    }

    /* Footer */
    footer {
      position: relative;
      z-index: 100;
      padding: 24px 5%;
      text-align: center;
      border-top: 1px solid var(--border);
      background: linear-gradient(to top, var(--bg-primary), transparent);
    }

    .footer-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .bot-cta {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 28px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 50px;
      color: var(--text-primary);
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    .bot-cta:hover {
      border-color: var(--accent-primary);
      background: rgba(99, 102, 241, 0.1);
      transform: translateY(-2px);
    }

    .bot-cta i {
      color: #0088cc;
      font-size: 18px;
    }

    .copyright {
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .copyright i {
      color: #ef4444;
      font-size: 12px;
      animation: heartbeat 1.5s ease-in-out infinite;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--bg-glass);
      backdrop-filter: blur(20px);
      border: 1px solid var(--success);
      border-radius: 12px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      transform: translateY(150px);
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 10000;
      box-shadow: var(--shadow-lg);
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    .toast-icon {
      width: 36px;
      height: 36px;
      background: var(--success);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 16px;
    }

    .toast-content {
      text-align: left;
    }

    .toast-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .toast-message {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    /* Light Theme */
    body.light-theme {
      --bg-primary: #f8f9fc;
      --bg-secondary: #ffffff;
      --bg-glass: rgba(255, 255, 255, 0.8);
      --text-primary: #1a1a2e;
      --text-secondary: #4a4a5a;
      --text-muted: #6b6b7b;
      --border: rgba(0, 0, 0, 0.08);
      --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.15);
    }

    body.light-theme .glass-card {
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.1), 0 0 60px rgba(99, 102, 241, 0.08);
    }

    body.light-theme .filename-container {
      background: rgba(0, 0, 0, 0.05);
    }

    /* Responsive */
    @media (max-width: 640px) {
      .glass-card {
        padding: 32px 24px;
      }

      .file-icon {
        width: 80px;
        height: 80px;
        font-size: 32px;
      }

      .filename {
        font-size: 16px;
      }

      .download-btn {
        padding: 16px 36px;
        font-size: 16px;
      }

      .features {
        gap: 16px;
      }

      .feature {
        font-size: 12px;
      }
    }

    /* Loading Animation */
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--bg-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .loading-overlay.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .loader {
      width: 60px;
      height: 60px;
      border: 3px solid var(--bg-secondary);
      border-top-color: var(--accent-primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

<body>
  <!-- Loading Overlay -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loader"></div>
  </div>

  <!-- Background Animation -->
  <div class="bg-animation">
    <div class="bg-gradient bg-gradient-1"></div>
    <div class="bg-gradient bg-gradient-2"></div>
    <div class="bg-gradient bg-gradient-3"></div>
  </div>

  <!-- Grid Overlay -->
  <div class="grid-overlay"></div>

  <!-- Header -->
  <header>
    <div class="logo">
      <div class="logo-icon">
        <i class="fas fa-cloud-download-alt"></i>
      </div>
      <span>FileStreamX</span>
    </div>
    <button class="theme-toggle" id="themeToggle" title="Toggle Theme">
      <i class="fas fa-moon"></i>
    </button>
  </header>

  <!-- Main Container -->
  <main class="main-container">
    <div class="glass-card">
      <div class="card-glow"></div>
      
      <!-- File Icon -->
      <div class="file-icon-wrapper">
        <div class="file-icon-ring"></div>
        <div class="file-icon-ring"></div>
        <div class="file-icon">
          <i class="fas fa-file-download"></i>
        </div>
      </div>

      <!-- Filename -->
      <div class="filename-container">
        <span class="filename">%s</span>
      </div>

      <!-- Download Button -->
      <div class="download-btn-wrapper">
        <button class="download-btn" id="downloadBtn" data-url="%s">
          <i class="fas fa-download"></i>
          <span>Get Link via Bot</span>
        </button>
      </div>

      <!-- File Size -->
      <div class="file-size">
        <i class="fas fa-database"></i>
        <span>_%s</span>
      </div>

      <!-- Features -->
      <div class="features">
        <div class="feature">
          <i class="fas fa-shield-alt"></i>
          <span>Secure Download</span>
        </div>
        <div class="feature">
          <i class="fas fa-bolt"></i>
          <span>Fast Speed</span>
        </div>
        <div class="feature">
          <i class="fas fa-infinity"></i>
          <span>No Limits</span>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="footer-content">
      <a href="https://t.me/Sujan_BotZ" class="bot-cta" target="_blank">
        <i class="fab fa-telegram"></i>
        <span>Generate Your Own Link</span>
      </a>
      <div class="copyright">
        <span>Made with</span>
        <i class="fas fa-heart"></i>
        <span>by Sujan_BotZ</span>
      </div>
    </div>
  </footer>

  <!-- Toast -->
  <div class="toast" id="toast">
    <div class="toast-icon">
      <i class="fas fa-check"></i>
    </div>
    <div class="toast-content">
      <div class="toast-title">Download Started!</div>
      <div class="toast-message">Your file is being downloaded</div>
    </div>
  </div>

  <script>
    // Hide loading overlay
    window.addEventListener('load', function() {
      setTimeout(() => {
        document.getElementById('loadingOverlay').classList.add('hidden');
      }, 500);
    });

    // Theme Toggle
    const themeToggle = document.getElementById('themeToggle');
    const body = document.body;
    const themeIcon = themeToggle.querySelector('i');

    // Load saved theme
    const savedTheme = localStorage.getItem('filestreamx-theme');
    if (savedTheme === 'light') {
      body.classList.add('light-theme');
      themeIcon.classList.remove('fa-moon');
      themeIcon.classList.add('fa-sun');
    }

    themeToggle.addEventListener('click', () => {
      body.classList.toggle('light-theme');
      const isLight = body.classList.contains('light-theme');
      
      if (isLight) {
        themeIcon.classList.remove('fa-moon');
        themeIcon.classList.add('fa-sun');
        localStorage.setItem('filestreamx-theme', 'light');
      } else {
        themeIcon.classList.remove('fa-sun');
        themeIcon.classList.add('fa-moon');
        localStorage.setItem('filestreamx-theme', 'dark');
      }
    });

    // Download Handler - Fixed download function
    document.getElementById('downloadBtn').addEventListener('click', function(e) {
      e.preventDefault();

      const url = this.getAttribute('data-url');
      const filename = document.querySelector('.filename').textContent.trim() || 'download';

      if (!url || url === '%s') {
        showToast('Error', 'Download URL not available');
        return;
      }

      showToast('Preparing Download...', 'Please wait');

      // Method 1: Try direct download using anchor tag with download attribute
      try {
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.style.display = 'none';
        document.body.appendChild(a);

        // Trigger click
        const clickEvent = new MouseEvent('click', {
          bubbles: true,
          cancelable: true,
          view: window
        });
        a.dispatchEvent(clickEvent);

        document.body.removeChild(a);

        showToast('Download Started!', 'Your file is being downloaded');
        return;
      } catch (error) {
        console.log('Direct download failed, trying alternative method...');
      }

      // Method 2: Use iframe for download (bypasses some restrictions)
      try {
        const iframe = document.createElement('iframe');
        iframe.style.display = 'none';
        iframe.src = url;
        document.body.appendChild(iframe);

        setTimeout(() => {
          document.body.removeChild(iframe);
        }, 5000);

        showToast('Download Started!', 'Check your downloads folder');
        return;
      } catch (error) {
        console.error('Iframe download failed:', error);
      }

      // Method 3: Final fallback - open in new tab and instruct user
      window.open(url, '_blank');
      showToast('File Opened', 'Right-click and "Save as" to download');
    });

    // Show toast notification
    function showToast(title, message) {
      const toast = document.getElementById('toast');
      const toastTitle = toast.querySelector('.toast-title');
      const toastMessage = toast.querySelector('.toast-message');
      
      toastTitle.textContent = title;
      toastMessage.textContent = message;
      
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }

    // Keyboard shortcut
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        document.getElementById('downloadBtn').click();
      }
    });
  </script>
</body>
